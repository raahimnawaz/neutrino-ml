name: neutrino-ml
channels:
  - conda-forge
dependencies:
  - python=3.11
  - root               # PyROOT + RDataFrame (Linux/macOS/WSL only)
  - uproot             # pure-python ROOT reader (used to write the synthetic test fixture)
  - awkward
  - numpy
  - pandas
  - pyarrow
  - scikit-learn
  - xgboost            # gradient-boosted baseline (the workhorse for tabular HEP)
  - matplotlib
  - pyyaml
  - pytest
  - pytorch            # CPU build; the event GNN (Task A, representation 3)
  - pip
  - pip:
    - torch_geometric  # graph neural network layers (SAGEConv, pooling)
